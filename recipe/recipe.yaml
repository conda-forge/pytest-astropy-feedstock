schema_version: 1

context:
  version: 0.12.0

package:
  name: pytest-astropy
  version: ${{ version }}

source:
- url: https://files.pythonhosted.org/packages/source/p/pytest-astropy/pytest_astropy-${{ version }}.tar.gz
  sha256: 0bdff1fa67a7856ec899c6f7810a86911253d76201a30822d7e4ef14b671bdc0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - setuptools_scm
    - wheel
  run:
    - python >=${{ python_min }}
    - pytest >=4.6
    - pytest-doctestplus >=1.0.0
    - pytest-remotedata >=0.4.1
    - pytest-astropy-header >=0.2.2
    - pytest-arraydiff >=0.5
    - pytest-filter-subpackage >=0.1.2
    - pytest-cov >=2.3.1
    - pytest-mock >=2.0
    - pytest-skip-slow ==1.1.0
    - attrs >=19.2.0
    - hypothesis >=5.1

tests:
  - python:
      imports:
        - pytest_remotedata
        - pytest_doctestplus
        - pytest_arraydiff
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  license: BSD-3-Clause
  license_file: LICENSE.rst
  summary: Meta-package containing dependencies for testing Astropy
  description: |
    This is a meta-package that pulls in the dependencies that are used by
    astropy and some affiliated packages for testing. It can also be used for
    testing packages that are not affiliated with the Astropy project.
  homepage: https://github.com/astropy/pytest-astropy
  repository: https://github.com/astropy/pytest-astropy
  documentation: https://github.com/astropy/pytest-astropy

extra:
  recipe-maintainers:
    - astrofrog
    - drdavella
    - mwcraig
